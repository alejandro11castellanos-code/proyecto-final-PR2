# Blueprint de Render para el backend (la base de datos sigue en Neon).
# Guía paso a paso: docs/despliegue-render.md
services:
  - type: web
    name: svb-gua-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    # Solo despliega solo si el repositorio está conectado a Render con GitHub. Si se creó pegando la
    # URL de un repositorio público (sin conexión), hay que usar Manual Deploy (ver docs/despliegue-render.md).
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Se pide al crear el servicio: la cadena de conexión de Neon (no se guarda en el repo).
      - key: DATABASE_URL
        sync: false
      # Render genera un secreto aleatorio para firmar los tokens.
      - key: JWT_SECRET
        generateValue: true
      # Correo de boletos (opcional). Se cargan a mano en Render > Environment; sin ellos el envio responde 502.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
