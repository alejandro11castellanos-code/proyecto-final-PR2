services:
  backend:
    build:
      context: ./backend
    container_name: svb-gua-backend
    restart: unless-stopped
    # Usa backend/.env (DATABASE_URL apunta a Neon desde que dejamos de correr
    # Postgres local en Docker).
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # scripts/seed.js espera database/seed.sql un nivel arriba de /app
      - ./database:/database:ro
    command: npm run dev
