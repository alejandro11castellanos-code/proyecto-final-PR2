# Genera el instalador de macOS para Macs con procesador Intel (x86_64) en una máquina Intel de GitHub.
# El .dmg armado en una Mac con Apple Silicon solo corre en Apple Silicon; este es para las Macs viejas.
# Se lanza A MANO: pestaña Actions -> "Instalador de macOS (Intel)" -> Run workflow.
# Al terminar, el resultado queda como artefacto descargable (SVB-GUA-Mac-Intel).
name: Instalador de macOS (Intel)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Dirección del servidor (backend) que usará la app por defecto
        required: false
        default: https://svb-gua-backend-esov.onrender.com

permissions:
  contents: read

jobs:
  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
          cache: maven

      - name: Crear instalador (.dmg)
        working-directory: desktop-client
        env:
          SVB_API_URL: ${{ inputs.api_url }}
        run: ./packaging/crear-instalador-mac.sh

      - name: Comprobar que es Intel
        working-directory: desktop-client
        run: |
          set -e
          dmg="$(ls target/instalador/*.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          file "$mnt/SVB-GUA.app/Contents/MacOS/SVB-GUA" | tee /dev/stderr | grep -q x86_64
          hdiutil detach "$mnt" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: SVB-GUA-Mac-Intel
          path: desktop-client/target/instalador/*
          if-no-files-found: error
